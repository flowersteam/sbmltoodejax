name: Simulator conformance

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  assignment-rules:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and optional oracles
        run: |
          python -m pip install 'jax[cpu]' equinox sbmltoodepy setuptools wheel -r validation/requirements.txt
          python -m pip install --no-build-isolation -e .
      - name: Offline analytic and independent-simulator checks
        run: python -m pytest test/test_jaxfuncs.py test/test_assignment_rules.py test/test_simulator_oracles.py -q
      - name: Export comparison trajectories and provenance
        run: python -m validation.compare_simulators --output outputs/oracles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-comparison
          path: outputs/oracles
